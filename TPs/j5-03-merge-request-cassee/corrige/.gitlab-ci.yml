stages: [qualite, test]

image: python:3.12-slim

variables:
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy

default:
  before_script:
    - pip install --no-cache-dir uv
    - uv sync --frozen
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache]

lint:
  stage: qualite
  script:
    - uv run ruff check .

tests:
  stage: test
  script:
    - uv run pytest --junitxml=rapport.xml --cov=src --cov-report=term
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    expire_in: 30 days
    paths: [rapport.xml]
    reports:
      junit: rapport.xml
